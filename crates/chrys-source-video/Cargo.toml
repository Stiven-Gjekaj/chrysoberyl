[package]
name = "chrys-source-video"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrys-source = { path = "../chrys-source" }
# A pure-Rust AV1 decoder with a safe API. The `asm` features are off, so
# the build needs no assembler and runs the same Rust code on each
# architecture.
re_rav1d = { version = "=0.1.3", default-features = false, features = ["bitdepth_8"] }
thiserror.workspace = true

[dev-dependencies]
sha2.workspace = true
