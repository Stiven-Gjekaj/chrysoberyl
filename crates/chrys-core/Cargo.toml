[package]
name = "chrys-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrys-source = { path = "../chrys-source" }
thiserror.workspace = true
sha2.workspace = true
rustfft.workspace = true
libm.workspace = true
# `imageproc`'s own package-legitimacy check returned a stale suspicious
# verdict (a registry-lookup failure inside that tool). A direct
# `crates.io/api/v1/crates/imageproc` query the same session returned clean
# metadata: a 2016 registry age, 12.7 million downloads, and the image-rs
# organisation as the source repository. That direct evidence is the
# disposition; the stale cache is not. See 01-RESEARCH.md.
imageproc.workspace = true

# Test-only. `chrys-core` itself still names no format crate; this decodes
# the committed refusal corpus in `tests/refusal.rs` only, the same way
# `chrys-cli` already depends on `chrys-source-raster` for its own tests.
[dev-dependencies]
chrys-source-raster = { path = "../chrys-source-raster" }
