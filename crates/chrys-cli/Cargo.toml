[package]
name = "chrys-cli"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# PDF input. It is off by default, because its determinism proof is
# younger than the proof for the other formats.
pdf = ["dep:chrys-source-pdf"]
# The native window and the GPU mirror. Off by default, so the CLI needs
# no GPU driver.
view = ["dep:chrys-view", "dep:chrys-gpu"]
# AV1 video in IVF, decoded in software. Off by default.
video = ["dep:chrys-source-video"]
# OBJ and STL meshes, through the fixed eight-view rig. Off by default.
mesh = ["dep:chrys-source-mesh"]

[[bin]]
name = "chrys"
path = "src/main.rs"

[dependencies]
chrys-source = { path = "../chrys-source" }
chrys-source-raster = { path = "../chrys-source-raster" }
chrys-source-sequence = { path = "../chrys-source-sequence" }
chrys-source-animation = { path = "../chrys-source-animation" }
chrys-source-svg = { path = "../chrys-source-svg" }
chrys-source-pdf = { path = "../chrys-source-pdf", optional = true }
chrys-view = { path = "../chrys-view", optional = true }
chrys-source-video = { path = "../chrys-source-video", optional = true }
chrys-source-mesh = { path = "../chrys-source-mesh", optional = true }
chrys-gpu = { path = "../chrys-gpu", optional = true }
chrys-core = { path = "../chrys-core" }
chrys-rule = { path = "../chrys-rule" }
chrys-baseline = { path = "../chrys-baseline" }
clap.workspace = true
anyhow.workspace = true
toml.workspace = true
serde.workspace = true
