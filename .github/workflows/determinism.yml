# The determinism proof. This workflow runs one command on six runner
# labels and compares the results. A red `agree` job means a portability
# bug in the comparison path. It is a release blocker, not a flaky test to
# retry.
#
# macos-15-intel is the last x86-64 macOS label GitHub will offer. It
# sunsets in August 2027, so a future maintainer is not surprised when it
# disappears.
#
# Linux and Windows aarch64 runners (ubuntu-24.04-arm, windows-11-arm) are
# standard, free, unlimited-minute runners on public repositories, per the
# 2025 and 2026 GitHub Actions changelog entries. No emulation layer and no
# self-hosted machine is needed to reach every architecture this project
# cares about.
name: determinism

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The guards job is the source-level half of the proof; the matrix
  # below (digest and agree) is the measured half. Both are needed: a
  # source-level guard cannot see a rounding difference that only shows
  # up at runtime, and a measured digest agreement cannot see a platform
  # transcendental or a banned dependency that has not yet caused a
  # visible mismatch. scripts/determinism-drill.sh is the re-runnable
  # drill that plants a defect against each guard here and confirms it
  # goes red; it is run by a person on a machine that can build two CPU
  # architectures, and is not part of this job or this matrix.
  guards:
    name: guards
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the determinism guards
        shell: bash
        run: cargo test -p chrys-core --test determinism

  digest:
    name: digest (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2022
          - windows-11-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain-install action runs here. The runner's own rustup
      # reads rust-toolchain.toml and installs the pinned channel with no
      # override, which is the determinism input this project depends on.
      - name: Build in release
        shell: bash
        run: cargo build --release -p chrys-cli

      - name: Run the digest report on the committed fixture pairs
        shell: bash
        run: |
          set -euo pipefail

          # tests/golden/pair-01 stays first, unprefixed, its four lines
          # byte-identical to what phase 1 committed, so a reader who
          # already knows this file still finds it opening the same way.
          cargo run -q --release -p chrys-cli -- compare tests/golden/pair-01/base.png tests/golden/pair-01/candidate.png --hash-only > digest.txt

          echo "== tests/golden/sequence-01 ==" >> digest.txt
          cargo run -q --release -p chrys-cli -- compare tests/golden/sequence-01/base tests/golden/sequence-01/candidate --hash-only >> digest.txt

          echo "== tests/golden/formats/gif ==" >> digest.txt
          cargo run -q --release -p chrys-cli -- compare tests/golden/formats/gif/base.gif tests/golden/formats/gif/candidate.gif --hash-only >> digest.txt

          echo "== tests/golden/formats/apng ==" >> digest.txt
          cargo run -q --release -p chrys-cli -- compare tests/golden/formats/apng/base.png tests/golden/formats/apng/candidate.png --hash-only >> digest.txt

          echo "== tests/golden/formats/webp-anim ==" >> digest.txt
          cargo run -q --release -p chrys-cli -- compare tests/golden/formats/webp-anim/base.webp tests/golden/formats/webp-anim/candidate.webp --hash-only >> digest.txt

          echo "== alpha-01 (gap G-01-1) ==" >> digest.txt
          cargo run -q --release -p chrys-cli -- compare tests/golden/alpha-01/base.png tests/golden/alpha-01/candidate.png --hash-only >> digest.txt

          # This line is phase 4's exit gate for the font and curve
          # determinism claim, and the template every later
          # format-specific gate reuses.
          #
          # The claim is not assumed. tiny-skia ships SIMD paths for
          # SSE2, AVX2 and NEON, enabled by default. That dispatch is
          # resolved per target architecture at compile time, not per CPU
          # at run time, so it cannot make two machines of the same
          # architecture disagree the way phase 1's auto-dispatching FFT
          # planner could. It can still, in principle, round differently
          # between the x86-64 and AArch64 paths, and no run of this
          # matrix against a glyph had happened before this line was
          # added.
          #
          # A green run on one developer machine is not evidence for this
          # claim. The six runner labels above are.
          #
          # If this line disagrees between runners, disable tiny-skia's
          # SIMD feature and measure again. That is the documented
          # fallback, and it is the same order of operations phase 1 used
          # for the fused multiply-add question: trust the stated
          # guarantee as the starting hypothesis, let this job falsify
          # it, and act on the result rather than on the claim.
          #
          # If it still disagrees after that, write the finding down and
          # withdraw the claim rather than ship it, which is what this
          # project already did for lossy animated WebP. Withdrawing is a
          # decision for a person, not something this job or a later
          # automated change may take by weakening what is compared.
          echo "== tests/golden/formats/svg ==" >> digest.txt
          cargo run -q --release -p chrys-cli -- compare tests/golden/formats/svg/base.svg tests/golden/formats/svg/candidate.svg --hash-only >> digest.txt

      - name: Upload the digest report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.label }}
          path: digest.txt

  agree:
    name: agree
    needs: digest
    runs-on: ubuntu-24.04
    steps:
      - name: Download every digest report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: reports

      - name: Compare the six digest reports
        shell: bash
        run: |
          set -euo pipefail

          # A fixture added later must be covered without a further edit
          # here, so this compares each runner's whole digest.txt against
          # the first runner's, byte for byte, rather than reading a fixed
          # set of line numbers. Byte comparison cannot miss a line the
          # loop was never told about.
          labels=()
          files=()
          for dir in reports/digest-*; do
            labels+=("${dir#reports/digest-}")
            files+=("$dir/digest.txt")
          done

          reference_file="${files[0]}"
          reference_label="${labels[0]}"

          disagreement=0
          for i in "${!files[@]}"; do
            if ! cmp -s "$reference_file" "${files[$i]}"; then
              disagreement=1
            fi
          done

          if [ "$disagreement" -ne 0 ]; then
            echo "The six runners do not agree. A red agree job is a"
            echo "portability bug in the comparison path, and a release"
            echo "blocker, not a flaky test to retry."
            echo
            for i in "${!files[@]}"; do
              if ! cmp -s "$reference_file" "${files[$i]}"; then
                echo "== diff: ${reference_label} vs ${labels[$i]} =="
                diff "$reference_file" "${files[$i]}" || true
                echo
              fi
            done
            exit 1
          fi

          echo "All six runners agree on every digest:"
          cat "$reference_file"
